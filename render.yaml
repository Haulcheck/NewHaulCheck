# Render blueprint.
#
# Infrastructure as code, so the deploy is repeatable and every variable is
# recorded in the repository rather than living only in a dashboard that one
# person can see.
#
# generateValue: Render creates a strong random value on first deploy and keeps
#   it. Never set these by hand.
# sync: false: set in the Render UI and never committed. These are the ones you
#   fill in -- see DEPLOYMENT.md.
services:
  - type: web
    name: haulcheck-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # The app exposes this already; it reports the database round-trip and which
    # provider each external service resolved to.
    healthCheckPath: /api/health
    envVars:
      - key: DB_NAME
        value: haulcheck
      # Outside development the app refuses to start unless CORS_ORIGINS is an
      # explicit list, which is deliberate: a permissive fallback in production
      # would be invisible.
      - key: ENVIRONMENT
        value: production
      # Render terminates TLS at a proxy, so the socket peer is the proxy, not
      # the client. Without this every request looks like one IP address and the
      # per-IP limits -- including the driver access-code sweep limit -- share a
      # single bucket, so one noisy client locks out everyone else.
      - key: TRUST_PROXY_HEADERS
        value: "1"
      # Deliberately not pinned to `s3` here. The four S3_* values below are
      # sync: false, so they do not exist on a first deploy -- and hardcoding
      # `s3` alongside them meant the blueprint shipped a configuration that
      # cannot work: the service builds, boots, then fails its health check on
      # a missing key and never goes live.
      #
      # Worse, once an operator sets this to `null` in the dashboard to get the
      # app up, the next blueprint sync silently overwrites it back to `s3` and
      # breaks production again.
      #
      # sync: false leaves it to the dashboard, which is where it belongs: unset
      # means no uploads (the app runs), and `s3` once R2 is configured. Neither
      # value is clobbered by a re-sync.
      - key: STORAGE_PROVIDER
        sync: false
      # R2 accepts only "auto".
      - key: S3_REGION
        value: auto
      # AI ships off. Every call site degrades to its existing fallback. To turn
      # it on: add `anthropic` to requirements.txt, set this to `anthropic`, and
      # add ANTHROPIC_API_KEY.
      - key: AI_PROVIDER
        value: "null"
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # --- Fill these in (Render dashboard -> Environment) ---
      - key: MONGO_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false

  # The web app. A static bundle on Render's CDN rather than a second container:
  # it costs nothing, and it keeps loading while the free-tier API is asleep, so
  # a visitor sees the app shell instead of a blank fifty-second wait.
  - type: web
    name: haulcheck-web
    runtime: static
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile && GENERATE_SOURCEMAP=false yarn build
    staticPublishPath: ./build
    routes:
      # React Router owns the paths. Without this, opening /maintenance directly
      # -- or refreshing it -- asks Render for a file that was never built.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # The driver app photographs defects and scans onboarding QR codes, so the
      # camera is needed. Nothing else is.
      - path: /*
        name: Permissions-Policy
        value: camera=(self), microphone=(), geolocation=()
      # CRA fingerprints these filenames, so a changed file is a changed URL and
      # this can be cached indefinitely.
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      # Render's default is Node 24, and react-scripts 5 is not built for it.
      # package.json already declares engines.node "20.x", and Render does read
      # it -- but only when it runs version detection at all. On a rebuild that
      # restored from cache it skipped detection entirely, went straight to
      # `yarn install` on Node 24, and yarn refused the engines range. The build
      # failed on a repo that had built fine an hour earlier.
      #
      # NODE_VERSION is the highest-precedence source, ahead of .node-version,
      # .nvmrc and package.json, so it does not depend on detection running.
      # Keep it equal to engines.node; they disagree at your peril.
      - key: NODE_VERSION
        value: "20.20.2"
      # Compiled into the bundle at build time -- changing it needs a rebuild,
      # not a restart. Set to https://api.haulcheck.co.uk once DNS is live.
      - key: REACT_APP_BACKEND_URL
        sync: false
